name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extrair projeto
        run: unzip -q projeto.zip -d projeto

      - name: Compilar APK
        working-directory: projeto/FpsBooster144
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FpsBooster144-debug-apk
          path: projeto/FpsBooster144/app/build/outputs/apk/debug/*.apk
